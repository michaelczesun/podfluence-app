<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CRM · hozd</title>
<meta name="description" content="Internes hozd-CRM" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0B0B0F" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E🎧%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/crm/lib/mobile.css?v=20260610q-cards" />
<link rel="stylesheet" href="/crm/lib/theme.css?v=20260610q-tabcolor" />
<style>
  :root {
    --bg-deep: #07070A;
    --bg: #0B0B0F;
    --surface: #16161D;
    --surface-elev: #1C1C25;
    --surface-glass: rgba(22,22,29,0.72);
    --border: #2A2A33;
    --border-soft: rgba(255,255,255,0.06);
    --primary: #8B5CF6;
    --primary-2: #A78BFA;
    --primary-dark: #7C3AED;
    --text: #FFFFFF;
    --text-muted: #9CA3AF;
    --text-dim: #6B7280;
    --success: #34D399;
    --warn: #FCD34D;
    --error: #F87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-deep); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated bubbles background */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    z-index: 0;
    pointer-events: none;
    animation: float 22s ease-in-out infinite;
  }
  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #8B5CF6, transparent 70%);
    top: -120px; left: -120px;
  }
  body::after {
    width: 620px; height: 620px;
    background: radial-gradient(circle, #7C3AED, transparent 70%);
    bottom: -160px; right: -180px;
    animation-delay: -8s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.05); }
    66%      { transform: translate(-30px, 40px) scale(0.95); }
  }

  a { color: var(--primary-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Scrollbar — dark thin */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(139,92,246,0.32); }

  /* Top bar */
  .topbar {
    height: 60px;
    background: var(--surface-glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    position: sticky; top: 0; z-index: 50;
    gap: 16px;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .topbar .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    box-shadow: 0 4px 14px rgba(139,92,246,0.4);
  }
  .topbar .title { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
  .topbar .title small { color: var(--text-muted); font-weight: 500; margin-left: 8px; }

  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .topbar-mid { flex: 1; display: flex; justify-content: center; max-width: 540px; margin: 0 auto; }

  .global-search {
    position: relative;
    width: 100%;
    max-width: 420px;
  }
  .global-search input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-soft);
    color: var(--text);
    padding: 8px 14px 8px 36px;
    border-radius: 9px;
    font-family: inherit; font-size: 13px;
    transition: border-color 0.15s, background 0.15s;
  }
  .global-search input::placeholder { color: var(--text-dim); }
  .global-search input:focus {
    outline: none;
    border-color: rgba(139,92,246,0.55);
    background: rgba(255,255,255,0.06);
  }
  .global-search::before {
    content: '⌕';
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
  }
  .global-search .kbd {
    position: absolute;
    right: 8px; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border: 1px solid var(--border-soft);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
    pointer-events: none;
  }

  .icon-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--surface-elev); color: var(--text); border-color: var(--border); }

  #logout {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-soft);
    padding: 7px 14px;
    border-radius: 9px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  #logout:hover { background: var(--surface-elev); color: var(--text); border-color: var(--border); }

  /* Layout */
  .shell { display: flex; min-height: calc(100vh - 60px); position: relative; z-index: 1; }
  aside {
    width: 248px; flex-shrink: 0;
    background: var(--surface-glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-right: 1px solid var(--border-soft);
    padding: 18px 10px;
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    transition: transform 0.24s cubic-bezier(.4,0,.2,1), width 0.24s;
  }
  .shell.sidebar-collapsed aside {
    transform: translateX(-100%);
    width: 0; padding-left: 0; padding-right: 0;
    border-right-width: 0;
  }
  .cat { margin-bottom: 8px; }
  .cat-head {
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
    padding: 9px 12px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    user-select: none;
    border-radius: 7px;
    transition: color 0.12s, background 0.12s;
  }
  .cat-head:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .cat-head .ic { font-size: 14px; }
  .cat-head .lbl { flex: 1; }
  .cat-head .caret { font-size: 9px; transition: transform 0.18s; opacity: 0.7; }
  .cat.collapsed .caret { transform: rotate(-90deg); }
  .cat.collapsed .cat-items { max-height: 0; opacity: 0; pointer-events: none; }
  .cat-items {
    display: flex; flex-direction: column; gap: 1px;
    max-height: 1200px; opacity: 1;
    overflow: hidden;
    transition: max-height 0.24s ease, opacity 0.18s;
  }
  .cat-items a {
    display: block;
    padding: 8px 12px 8px 26px;
    border-radius: 7px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.12s;
  }
  .cat-items a:hover {
    background: rgba(255,255,255,0.03);
    color: var(--text);
    text-decoration: none;
    transform: translateX(2px);
  }
  .cat-items a.active {
    background: linear-gradient(90deg, rgba(139,92,246,0.22), rgba(139,92,246,0.06));
    color: #fff;
    border-left-color: var(--primary-2);
    font-weight: 600;
  }

  main {
    flex: 1;
    background: transparent;
    min-width: 0;
    position: relative;
  }

  /* Page-transition (fade) */
  #panel-mount { animation: fadeInUp 0.28s ease both; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Shared panel styles */
  .panel-shell { padding: 24px; min-height: 100%; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .panel-head h2 { font-size: 20px; font-weight: 600; color: #fff; margin: 0; }
  .refresh-btn { background: rgba(139,92,246,0.15); color: #A78BFA; border: 1px solid rgba(139,92,246,0.3); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: rgba(139,92,246,0.25); }
  .panel-body { min-height: 400px; }
  .loading { text-align: center; padding: 60px; color: #9CA3AF; }
  .empty { text-align: center; padding: 60px; color: #6B7280; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-tile { background: #16161D; border: 1px solid #2A2A33; padding: 18px; border-radius: 14px; }
  .kpi-tile .label { font-size: 12px; color: #9CA3AF; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-tile .value { font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }
  .kpi-tile .hint { font-size: 11px; color: #6B7280; margin-top: 6px; }
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2A2A33; }
  .data-table th { font-size: 11px; text-transform: uppercase; color: #9CA3AF; }
  .leaderboard .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2A2A33; }
  .leaderboard .rank { width: 24px; color: #6B7280; font-variant-numeric: tabular-nums; }
  .leaderboard .name { flex: 1; color: #fff; }
  .leaderboard .val { color: #A78BFA; font-weight: 600; }
  .chip { display: inline-block; background: rgba(139,92,246,0.15); color: #A78BFA; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin-right: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  /* Toast-Stile werden von /crm/lib/toast.js Modul injiziert */
  /* Cmd-K Modal-Styles werden vom /crm/lib/cmdk.js Modul injiziert */

  /* Sidebar-toggle (mobile + cmd+/) */
  #sidebar-toggle { display: none; }
  @media (max-width: 1024px) {
    #sidebar-toggle { display: inline-flex; }
    aside {
      position: fixed; left: 0; top: 60px;
      z-index: 60;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .shell:not(.sidebar-open) aside { transform: translateX(-100%); }
  }

  /* Mobile-block raus — wird vollständig responsive (User-Wunsch 7.6.) */
  .mobile-block { display: none !important; }

  /* Mobile: kompakte Topbar, Sidebar als Drawer, Charts responsive */
  @media (max-width: 767px) {
    .topbar { height: 52px; padding: 0 12px; gap: 8px; }
    .topbar .title small { display: none; }
    .topbar-mid { display: none; }
    .topbar .logo { width: 30px; height: 30px; font-size: 15px; }
    #logout { padding: 6px 10px; font-size: 12px; }
    aside {
      width: 80%; max-width: 280px;
      position: fixed !important; left: 0; top: 52px;
      /* über bottom-bar (z:70) und backdrop (z:75) liegen, damit Drawer wirklich vorne ist */
      z-index: 80;
      height: calc(100vh - 52px);
      transform: translateX(-100%);
      will-change: transform;
    }
    .shell.sidebar-open aside { transform: translateX(0) !important; }
    .shell.sidebar-open::before {
      content: '';
      position: fixed; inset: 52px 0 0 0;
      background: rgba(0,0,0,0.5);
      z-index: 75;
    }
    .shell { min-height: calc(100vh - 52px); }
    main { padding: 0 !important; width: 100%; }
    .panel-shell { padding: 16px 12px !important; }
    .panel-head h2 { font-size: 18px !important; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
    .kpi-tile .value { font-size: 22px !important; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 6px 8px !important; }
    .toolbar { flex-wrap: wrap; gap: 6px; }
    .toolbar-btn { padding: 6px 10px !important; font-size: 12px !important; }
    .drawer { width: 100% !important; }
  }

  /* ---- Mobile Bottom-Tab-Bar (<768px) ---- */
  .mobile-bottom-bar { display: none; }
  @media (max-width: 767px) {
    .mobile-bottom-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-flow: column;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      box-sizing: border-box;
      height: calc(56px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--surface-glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-top: 1px solid var(--border-soft);
      z-index: 70;
      align-items: stretch;
    }
    .mobile-tab-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      position: relative;
      padding: 6px 4px 4px;
      transition: color 0.15s ease;
    }
    .mobile-tab-item .mtab-ic {
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .mobile-tab-item .mtab-ic svg {
      width: 22px; height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mobile-tab-item .mtab-lbl { display: none; }
    .mobile-tab-active {
      color: var(--primary-2);
    }
    .mobile-tab-active .mtab-ic svg {
      fill: rgba(139,92,246,0.22);
      stroke: var(--primary-2);
    }
    .mobile-tab-active .mtab-lbl { display: block; }
    .mobile-tab-active::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 32px; height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--primary);
    }
    body.has-bottom-bar { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
    body.has-bottom-bar .shell { min-height: calc(100vh - 52px - 56px - env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="mobile-block">
  <h1>CRM ist Desktop-optimiert</h1>
  <p>Bitte öffne das CRM auf einem größeren Bildschirm — oder lade dir die hozd-App.</p>
  <a href="https://hozd.app">Zur hozd-App</a>
</div>

<header class="topbar">
  <div class="brand">
    <button id="sidebar-toggle" class="icon-btn" title="Sidebar (Cmd+/)">☰</button>
    <div class="logo">🎧</div>
    <div class="title">hozd <small>CRM</small></div>
  </div>
  <div class="topbar-mid">
    <div class="global-search">
      <input id="global-search-input" type="text" placeholder="Suche Panels, Nutzer…" autocomplete="off" spellcheck="false" />
      <span class="kbd">⌘K</span>
    </div>
  </div>
  <div class="topbar-right">
    <button id="settings-btn" class="icon-btn" title="Einstellungen">⚙</button>
    <button id="logout">Abmelden</button>
  </div>
</header>

<div class="shell" id="shell">
  <aside id="sidebar"></aside>
  <main><div id="panel-mount"><div class="loading">Lädt…</div></div></main>
</div>

<nav class="mobile-bottom-bar" id="mobile-bottom-bar" aria-label="Hauptnavigation"></nav>

<script type="module">
import { sb } from '/lib/supabase.js?v=20260610q'
import { openCmdK, closeCmdK, toggleCmdK, isCmdKOpen, installCmdK } from '/crm/lib/cmdk.js?v=20260610q-micfab'
import '/crm/lib/toast.js?v=20260610q-toast'

// ---- Auth-Guard (Admin-Only) ----
const mountEl = document.getElementById('panel-mount')
try {
  const { data: { session }, error: sessionError } = await sb.auth.getSession()
  if (sessionError) throw sessionError
  if (!session) {
    location.replace('/login/?next=/crm/')
    throw new Error('no session — redirecting')
  }
  const { data: profile, error: profileError } = await sb
    .from('users')
    .select('admin_role, is_app_admin')
    .eq('id', session.user.id)
    .maybeSingle()
  if (profileError) throw profileError
  // admin_role (enum) ist die Wahrheit; is_app_admin (bool) ist Legacy-Fallback
  const resolvedRole = profile?.admin_role || (profile?.is_app_admin ? 'admin' : null)
  if (!resolvedRole) {
    location.replace('/app/')
    throw new Error('not admin — redirecting')
  }
  window.__CRM_ROLE__ = resolvedRole.toLowerCase()
} catch (authErr) {
  mountEl.innerHTML = `<div class="panel-shell"><div class="empty" style="color:#F87171">Auth-Fehler: ${authErr?.message || authErr}<br><br><a href="/login/" style="color:#A78BFA">Erneut anmelden</a></div></div>`
  throw authErr
}

document.getElementById('logout').addEventListener('click', async () => {
  await sb.auth.signOut()
  location.href = '/login/'
})

// ---- Top-Tab-Registry (5 primary entries) ----
// Sub-Module: panels/_tab-<id>.js — laden ihrerseits die existierenden 35 Panel-Dateien.
const TAB_ICONS = {
  pulse:   '📊',
  people:  '👥',
  growth:  '📈',
  content: '📝',
  system:  '⚙️'
}

// Permissions-Layer: aus lib/permissions.json
let PERMISSIONS = null
try {
  const permRes = await fetch('/crm/lib/permissions.json?v=20260610q', { cache: 'no-store' })
  PERMISSIONS = await permRes.json()
} catch (e) {
  console.error('[crm] permissions.json load error', e)
  PERMISSIONS = { tabs: {}, nullRoleAccess: false }
}

const role = window.__CRM_ROLE__ || 'admin'
// owner + admin sehen IMMER ALLES — höchste Rollen umgehen Permission-Mapping
const IS_SUPERROLE = role === 'owner' || role === 'admin'

// Top-Tabs gefiltert nach Rolle (deny → ausgeblendet)
// Hash-Format: #<tab>/<subtab> (z.B. #people/users, #growth/funnels)
// id === tabKey === erstes Hash-Segment
const PANELS = Object.entries(PERMISSIONS.tabs || {}).map(([key, def]) => ({
  id: key,
  tabKey: key,
  title: def.label || key,
  icon: TAB_ICONS[key] || '•',
  access: IS_SUPERROLE ? 'rw' : (def.access?.[role] || (PERMISSIONS.nullRoleAccess ? 'rw' : 'deny')),
  subtabs: def.subtabs || null
}))

const VISIBLE_PANELS = PANELS.filter(p => p.access && p.access !== 'deny')
const VISIBLE_IDS = new Set(VISIBLE_PANELS.map(p => p.id))

// Subtab-Key → Eltern-Tab-Key. Viele KPI-Tiles/Links routen historisch auf
// einen BAREN Hash wie '#dau-trend' statt '#pulse/dau-trend'. Ohne diese Map
// landet so ein Hash im Role-Guard (kein Top-Tab) und wird "Kein Zugriff" —
// sogar für owner. Damit lösen wir bare Subtab-Hashes zentral auf.
const SUBTAB_TO_TAB = new Map()
for (const p of PANELS) {
  if (p.subtabs) {
    for (const subKey of Object.keys(p.subtabs)) {
      if (!SUBTAB_TO_TAB.has(subKey)) SUBTAB_TO_TAB.set(subKey, p.id)
    }
  }
}

// Default-Subtab pro Tab: erster Subtab auf den die Rolle Zugriff hat
function defaultSubFor(tabKey) {
  const meta = PANELS.find(p => p.id === tabKey)
  if (!meta?.subtabs) return ''
  const entries = Object.entries(meta.subtabs)
  const first = entries.find(([, acc]) => {
    if (IS_SUPERROLE) return true
    const a = (acc && typeof acc === 'object') ? acc[role] : acc
    return a && a !== 'deny'
  })
  return first ? first[0] : ''
}

// Vollständigen Hash-Pfad bauen (für Sidebar-Links: #tab/defaultsub)
function buildHashFor(tabKey) {
  const sub = defaultSubFor(tabKey)
  return sub ? `${tabKey}/${sub}` : tabKey
}

// ---- Sidebar rendern (flach, 5 Top-Tabs) ----
const sidebar = document.getElementById('sidebar')
sidebar.innerHTML = `
  <div class="cat" data-cat="top">
    <div class="cat-items" style="gap:2px">
      ${VISIBLE_PANELS.map(p => `
        <a href="#${buildHashFor(p.id)}" data-pid="${p.id}" class="top-tab-link">
          <span class="ic" style="font-size:15px;margin-right:10px">${p.icon}</span>
          <span class="lbl">${p.title}</span>
        </a>
      `).join('')}
    </div>
  </div>
`

// Top-Tab-Links: etwas mehr Padding, kein left-indent
const topTabStyle = document.createElement('style')
topTabStyle.textContent = `
  .top-tab-link {
    padding: 11px 14px !important;
    display: flex !important; align-items: center;
    font-size: 14px !important;
    font-weight: 500;
  }
  .top-tab-link.active {
    background: linear-gradient(90deg, rgba(139,92,246,0.28), rgba(139,92,246,0.08));
  }
`
document.head.appendChild(topTabStyle)

// ---- Mobile Bottom-Tab-Bar (<768px) ----
// SVG-Icons pro Top-Tab (stroke-based, fill nur wenn active)
const BOTTOM_TAB_SVGS = {
  pulse:   '<svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
  people:  '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.4 3.3-5.3 6.5-5.3s5.9 1.9 6.5 5.3"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.8c2.7.2 4.7 1.9 5.5 5.2"/></svg>',
  growth:  '<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M14 6h7v7"/></svg>',
  content: '<svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>',
  system:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.1.7.5 1.3 1.5 1.4H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.6z"/></svg>'
}
const BOTTOM_TAB_ORDER = ['pulse', 'people', 'growth', 'content', 'system']
const bottomBar = document.getElementById('mobile-bottom-bar')
const bottomTabs = BOTTOM_TAB_ORDER
  .map(key => VISIBLE_PANELS.find(p => p.id === key))
  .filter(Boolean)
if (bottomTabs.length) {
  bottomBar.innerHTML = bottomTabs.map(p => `
    <a href="#${buildHashFor(p.id)}" data-pid="${p.id}" class="mobile-tab-item">
      <span class="mtab-ic">${BOTTOM_TAB_SVGS[p.id] || ''}</span>
      <span class="mtab-lbl">${p.title}</span>
    </a>
  `).join('')
  document.body.classList.add('has-bottom-bar')
}

// ---- Toast ---- (Lib lädt window.toast via /crm/lib/toast.js)

// ---- Sidebar Toggle (mobile + Cmd+/) ----
const shellEl = document.getElementById('shell')
const sidebarToggle = document.getElementById('sidebar-toggle')

// Default-State: auf Mobile (<768px) sidebar GESCHLOSSEN, auf Desktop offen
function initSidebarState() {
  if (window.innerWidth < 768) {
    shellEl.classList.remove('sidebar-open')
  } else {
    shellEl.classList.add('sidebar-open')
    shellEl.classList.remove('sidebar-collapsed')
  }
}
initSidebarState()

// Resize: bei Übergang Desktop↔Mobile Sidebar-State korrigieren
// (sonst bleibt Sidebar nach Resize fälschlicherweise offen/zu)
let _wasMobile = window.innerWidth < 768
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth < 768
  if (isMobile !== _wasMobile) {
    _wasMobile = isMobile
    initSidebarState()
  }
})

sidebarToggle?.addEventListener('click', (e) => {
  e.stopPropagation()
  shellEl.classList.toggle('sidebar-open')
  // Desktop-Collapse-Modus nur >=1024px
  if (window.innerWidth >= 1024) {
    shellEl.classList.toggle('sidebar-collapsed')
  }
})

// Mobile: Klick auf Backdrop (außerhalb der Sidebar) schließt sie
shellEl.addEventListener('click', (e) => {
  if (e.target.closest('aside')) return
  if (e.target.closest('#sidebar-toggle')) return
  if (window.innerWidth < 768) {
    shellEl.classList.remove('sidebar-open')
  }
})

// Mobile: Klick auf einen Sidebar-Link schließt die Sidebar danach
sidebar.addEventListener('click', (e) => {
  // closest statt matches — fängt auch Klicks auf Icon/Span innerhalb des <a>
  if (e.target.closest('a[data-pid]') && window.innerWidth < 768) {
    shellEl.classList.remove('sidebar-open')
  }
})

// ---- Settings button ----
// settings ist ein SUB-TAB von 'system', nicht ein eigener Top-Tab.
// Direkter Hash '#settings' würde im Role-Guard (VISIBLE_IDS.has('settings') === false)
// als "Kein Zugriff" abgelehnt — auch für owner. Daher korrekt auf #system/settings routen.
document.getElementById('settings-btn')?.addEventListener('click', () => {
  location.hash = '#system/settings'
})

// ---- Cmd-K Universal Bar (lib/cmdk.js) ----
installCmdK({
  sb,
  panels: VISIBLE_PANELS.map(p => ({ id: p.id, title: p.title, icon: p.icon })),
  buildHashFor,
  role: window.__CRM_ROLE__ || 'admin',
  bindKeyboard: true,
  installMicFab: true
})

// Global-search input in top-bar opens Cmd+K modal
document.getElementById('global-search-input')?.addEventListener('focus', e => {
  e.target.blur()
  openCmdK()
})

// ---- Keyboard Shortcuts (Cmd+K wird vom cmdk-Modul gehandhabt) ----
window.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey
  // Cmd+/ — Desktop: toggle collapse; Mobile: toggle drawer
  if (meta && e.key === '/') {
    e.preventDefault()
    if (window.innerWidth >= 1024) {
      shellEl.classList.toggle('sidebar-collapsed')
      shellEl.classList.toggle('sidebar-open')
    } else {
      shellEl.classList.toggle('sidebar-open')
    }
    return
  }
  // ESC
  if (e.key === 'Escape') {
    if (isCmdKOpen()) return  // Modul handhabt sein eigenes Esc
    // close any open drawer/modal
    document.querySelectorAll('.drawer.open, .modal.open, [data-dismiss-on-esc].open').forEach(el => {
      el.classList.remove('open')
    })
    document.querySelectorAll('.drawer-backdrop, .modal-backdrop').forEach(el => el.remove())
  }
})

// ---- Routing / Lazy-Load ----
const cache = new Map()
const mount = document.getElementById('panel-mount')

async function loadPanel() {
  const hashRaw = location.hash.replace(/^#/, '').trim()
  // Hash-Format: <tab>/<subtab>?<params>  — beides optional
  const [hashPath, queryStr = ''] = hashRaw.split('?')
  const segments = hashPath.split('/').filter(Boolean)
  // Legacy-Migration: alte '#tab-<key>'-Hashes auf neues Format umbiegen
  let rawTab = segments[0] || ''
  if (rawTab.startsWith('tab-')) rawTab = rawTab.slice(4)
  let subFromHash = segments[1] || ''
  // Back-Compat: alte Sub-Tab-Module schreiben '?sub=<key>' in den Hash.
  // Wenn der Pfad keinen zweiten Segment hat, akzeptiere ?sub=.
  if (!subFromHash && queryStr) {
    try {
      const sp = new URLSearchParams(queryStr)
      if (sp.get('sub')) subFromHash = sp.get('sub')
    } catch {}
  }

  // Default-Load: 'pulse' falls verfügbar, sonst erster sichtbarer Tab
  const fallback = (VISIBLE_PANELS.find(p => p.id === 'pulse') || VISIBLE_PANELS[0])?.id
  let id = rawTab || fallback

  // Bare-Subtab-Hash auflösen: ist 'id' kein Top-Tab aber ein bekannter Subtab
  // (z.B. '#dau-trend', '#settings', '#users-list'), auf '#<elternTab>/<subtab>'
  // umbiegen statt fälschlich "Kein Zugriff" zu zeigen.
  if (id && !VISIBLE_IDS.has(id) && SUBTAB_TO_TAB.has(id)) {
    subFromHash = id
    id = SUBTAB_TO_TAB.get(id)
    rawTab = id
    const target = '#' + id + '/' + subFromHash + (queryStr ? '?' + queryStr : '')
    if (location.hash !== target) history.replaceState(null, '', target)
  }

  // Role-Guard: nicht erlaubte Top-Tabs auf Fallback zurückbiegen
  if (id && !VISIBLE_IDS.has(id)) {
    mount.innerHTML = `<div class="panel-shell"><div class="empty" style="color:#F87171">Kein Zugriff auf „${id}" (Rolle: ${role}).</div></div>`
    return
  }

  // Falls noch kein Subtab im Hash, aber Tab hat welche → in Hash setzen (ohne Reload-Loop)
  if (!subFromHash) {
    const def = defaultSubFor(id)
    if (def) {
      const target = '#' + id + '/' + def + (queryStr ? '?' + queryStr : '')
      if (location.hash !== target) {
        // replaceState verhindert History-Pollution + zweiten hashchange-Fire
        history.replaceState(null, '', target)
      }
      subFromHash = def
    }
  }

  // Set active state
  sidebar.querySelectorAll('a[data-pid]').forEach(a => {
    a.classList.toggle('active', a.dataset.pid === id)
  })
  bottomBar.querySelectorAll('a[data-pid]').forEach(a => {
    a.classList.toggle('mobile-tab-active', a.dataset.pid === id)
  })

  // Color-Language pro Top-Tab: setzt CSS-Custom-Props via [data-active-tab="…"]-Selektor
  // (siehe /crm/lib/theme.css). --tab-accent / --tab-glow steuern Sidebar-Glow,
  // Section-Title-Border und Hero-Tile-Hover-Border.
  if (id) document.body.setAttribute('data-active-tab', id)

  const meta = PANELS.find(p => p.id === id)
  if (!meta) {
    mount.innerHTML = `<div class="panel-shell"><div class="empty">Panel „${id}" nicht gefunden.</div></div>`
    return
  }

  // Re-trigger fade animation
  mount.style.animation = 'none'
  void mount.offsetWidth
  mount.style.animation = ''

  mount.innerHTML = `<div class="panel-shell"><div class="panel-head"><h2>${meta.title}</h2></div><div class="loading">Lädt…</div></div>`

  // modulePath außerhalb des try, damit der catch-Block ihn im Fehlerfall kennt.
  let modulePath = '(noch nicht ermittelt)'
  try {
    let mod
    if (cache.has(id)) {
      mod = cache.get(id)
      modulePath = '(aus Cache)'
    } else {
      // Cache-Bust pro Stunde — sonst hängen User in alter JS-Version fest nach Push.
      const v = new Date().toISOString().slice(0, 13)  // YYYY-MM-DDTHH
      // Top-Tabs werden als _tab-<key>.js geladen (Unterstrich-Prefix = Sub-Module-Loader).
      // Diese Loader importieren ihrerseits die existierenden Panel-Dateien.
      // VISIBLE_IDS sind Top-Tab-Keys → immer _tab-<key>.js
      modulePath = VISIBLE_IDS.has(id)
        ? `./panels/_tab-${id}.js?v=${v}`
        : `./panels/${id}.js?v=${v}`
      mod = await import(modulePath)
      cache.set(id, mod)
    }
    const panel = mod.default || mod
    if (!panel || typeof panel.mount !== 'function') {
      throw new Error('Panel-Modul exportiert kein mount()')
    }
    // Subtab (zweites Hash-Segment) + zusätzliche Query-Params an mount() weitergeben
    // sub = 'users' (Subtab-Key), params = 'u=abc&x=1' (alles nach '?')
    await panel.mount(mount, {
      role,
      access: meta.access,
      sub: subFromHash,
      params: queryStr,
      permissions: PERMISSIONS
    })
  } catch (e) {
    // Voller Stack-Trace in die Console — User können das per Screenshot teilen.
    console.error('[crm] panel load error', { panelId: id, modulePath, error: e, stack: e?.stack })
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]))
    const errMsg = escapeHtml(e?.message || e)
    const errStack = escapeHtml(e?.stack || '')
    const safePath = escapeHtml(modulePath)
    const safeId = escapeHtml(id)
    mount.innerHTML = `
      <div class="panel-shell">
        <div class="panel-head"><h2>${escapeHtml(meta.title)}</h2></div>
        <div class="empty" style="color:#F87171; text-align:left; max-width:720px; margin:24px auto; padding:20px; border:1px solid #F87171; border-radius:8px; background:rgba(248,113,113,0.05)">
          <div style="font-weight:600; font-size:16px; margin-bottom:12px">Panel "${safeId}" konnte nicht geladen werden</div>
          <div style="margin-bottom:8px"><span style="color:#9CA3AF">Datei:</span> <code style="background:#1F2937; padding:2px 6px; border-radius:4px; color:#E5E7EB">${safePath}</code></div>
          <div style="margin-bottom:12px"><span style="color:#9CA3AF">Fehler:</span> <code style="background:#1F2937; padding:2px 6px; border-radius:4px; color:#E5E7EB">${errMsg}</code></div>
          ${errStack ? `<details style="margin-bottom:12px"><summary style="cursor:pointer; color:#9CA3AF; font-size:12px">Stack-Trace anzeigen</summary><pre style="background:#1F2937; color:#E5E7EB; padding:12px; border-radius:4px; font-size:11px; overflow-x:auto; white-space:pre-wrap; margin-top:8px">${errStack}</pre></details>` : ''}
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:16px">
            <button id="crm-err-retry" style="background:#F87171; color:#111827; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600">Erneut versuchen</button>
            <button id="crm-err-console" style="background:transparent; color:#9CA3AF; border:1px solid #374151; padding:8px 16px; border-radius:6px; cursor:pointer">Für Devs: Console öffnen (F12 / Cmd+Opt+I)</button>
          </div>
          <div style="font-size:11px; color:#6B7280; margin-top:12px">Vollständiger Stack-Trace + Details liegen in der Browser-Console (<code>[crm] panel load error</code>) für Screenshots.</div>
        </div>
      </div>`
    const retryBtn = document.getElementById('crm-err-retry')
    if (retryBtn) retryBtn.addEventListener('click', () => {
      cache.delete(id)  // Cache leeren — sonst lädt Retry denselben kaputten Modul-Stand.
      loadPanel()
    })
    const consoleBtn = document.getElementById('crm-err-console')
    if (consoleBtn) consoleBtn.addEventListener('click', () => {
      console.error('[crm] DEV-INFO — Panel:', id, '| Datei:', modulePath, '| Fehler:', e)
      window.toast?.({
        type: 'info',
        title: 'Console öffnen',
        message: 'F12 (Windows/Linux) oder Cmd+Option+I (Mac). Suche dort nach "[crm] panel load error".',
        duration: 7000
      })
    })
  }
}

window.addEventListener('hashchange', loadPanel)
loadPanel()
</script>
