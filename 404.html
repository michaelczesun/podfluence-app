<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<title>hozd</title>
<script>
// 4.6.j SPA-Fallback für GitHub Pages: /u/<username> ohne Datei-Pfad
// → redirect zu /u/?u=<username> damit die Single-Page-App rendern kann.
(function () {
  var path = window.location.pathname;
  // /u/<irgendwas>
  var m = path.match(/^\/u\/([^\/]+)\/?$/);
  if (m && m[1]) {
    window.location.replace('/u/?u=' + encodeURIComponent(m[1]) + window.location.hash);
    return;
  }
  // /verify/<token> oder anderes — landet auf Home
  window.location.replace('/');
})();
</script>
</head>

</p>
