<script>
// 4.6.j SPA-Fallback für GitHub Pages: /u/<username> ohne static-File
// → redirect zu /u/?u=<username>. Static-Files (für existing User) werden
// vorrangig geladen, dieser Fallback greift nur bei neuen Users.
(function () {
  var path = window.location.pathname;
  var m = path.match(/^\/u\/([^\/]+)\/?$/);
  if (m && m[1]) {
    window.location.replace('/u/?u=' + encodeURIComponent(m[1]) + window.location.hash);
    return;
  }
  window.location.replace('/');
})();
</script>
