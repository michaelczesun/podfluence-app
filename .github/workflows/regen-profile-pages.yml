name: Regenerate Profile Pages

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public users
        env:
          ANON_KEY: sb_publishable_aJrojJ8QFI0uCETwimeRLw_-ymYCVw_
        run: |
          curl -fsSL "https://nlgedaxiailhhcmgtmdp.supabase.co/functions/v1/public-users-list" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "Accept: application/json" \
            -o /tmp/hozd_users.json
          echo "Got $(jq length /tmp/hozd_users.json) public-safe users"

      - name: Generate static profile HTMLs
        run: python3 scripts/gen_profile_pages.py

      - name: Commit + push if changed
        run: |
          git config user.name "hozd-bot"
          git config user.email "bot@hozd.app"
          git add -A u/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "chore(seo): auto-regen profile pages [skip ci]"
            git push
          fi
