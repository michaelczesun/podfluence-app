name: Regenerate Profile Pages

on:
  schedule:
    # Alle 30 Minuten neue User-HTMLs generieren
    - cron: '*/30 * * * *'
  workflow_dispatch:  # manuell triggerbar im GitHub UI

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch users from Supabase
        env:
          SUPABASE_URL: https://nlgedaxiailhhcmgtmdp.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "⚠️  SUPABASE_SERVICE_KEY secret nicht gesetzt — überspringe Regen."
            echo "Setup: GitHub Repo → Settings → Secrets → Actions → SUPABASE_SERVICE_KEY"
            exit 0
          fi
          curl -fsSL "$SUPABASE_URL/rest/v1/users?is_hidden=eq.false&select=username,full_name,bio,avatar_url,type,is_verified,country&limit=500" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Accept: application/json" \
            -o /tmp/hozd_users.json
          echo "Got $(jq length /tmp/hozd_users.json) users"

      - name: Run generator
        if: hashFiles('/tmp/hozd_users.json') != ''
        run: |
          # Generator-Script inline damit kein extra File commited werden muss
          python3 <<'PYEOF'
          import json, os, html

          OUT_DIR = 'u'
          SHARED_HTML = open(f'{OUT_DIR}/index.html').read()

          with open('/tmp/hozd_users.json') as f:
              users = json.load(f)

          created = 0
          for u in users:
              username = (u.get('username') or '').strip()
              if not username:
                  continue
              full_name = (u.get('full_name') or username).strip()
              bio = (u.get('bio') or '').strip()
              avatar = (u.get('avatar_url') or '').strip()
              user_type = u.get('type') or 'user'
              type_label = {
                  'podcaster': 'Podcaster:in',
                  'listener':  'Hörer:in',
                  'bot':       'hozd-Bot',
              }.get(user_type, '')
              country = (u.get('country') or '').strip()
              is_verified = bool(u.get('is_verified'))

              title = f"{full_name} (@{username}) · hozd"
              desc_parts = []
              if type_label: desc_parts.append(type_label)
              if country: desc_parts.append(f"📍 {country}")
              if is_verified: desc_parts.append('✓ verifiziert')
              if username == 'michaelczesun': desc_parts.append('👑 Founder')
              if bio:
                  desc = f"{bio[:140]}{'…' if len(bio) > 140 else ''} · " + (' · '.join(desc_parts) if desc_parts else 'hozd')
              else:
                  desc = (' · '.join(desc_parts) + ' auf hozd — die soziale Podcast-App') if desc_parts else f'{full_name} auf hozd'

              og_image = avatar if avatar else 'https://hozd.app/og-default.png'

              h = SHARED_HTML
              h = h.replace('<title id="page-title">hozd — Profil</title>',
                            f'<title id="page-title">{html.escape(title)}</title>')
              h = h.replace('<meta name="description" id="page-desc" content="hozd — die soziale Podcast-App"/>',
                            f'<meta name="description" id="page-desc" content="{html.escape(desc)}"/>')
              h = h.replace('<meta property="og:title" content="hozd — Profil"/>',
                            f'<meta property="og:title" content="{html.escape(title)}"/>')
              h = h.replace('<meta property="og:description" content="Read-only Profil-Ansicht. App laden für Follow + Posten."/>',
                            f'<meta property="og:description" content="{html.escape(desc)}"/>')
              h = h.replace('<meta property="og:image" content="https://hozd.app/og-default.png"/>',
                            f'<meta property="og:image" content="{html.escape(og_image)}"/>')
              twitter_inject = f'''<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="{html.escape(title)}"/>
<meta name="twitter:description" content="{html.escape(desc)}"/>
<meta name="twitter:image" content="{html.escape(og_image)}"/>
<link rel="canonical" href="https://hozd.app/u/{html.escape(username)}"/>'''
              h = h.replace('<meta name="twitter:card" content="summary_large_image"/>', twitter_inject)
              h = h.replace('  var username = getUsername();',
                            f"  var username = '{username}'; // baked at generation time")

              user_dir = f'{OUT_DIR}/{username}'
              os.makedirs(user_dir, exist_ok=True)
              with open(f'{user_dir}/index.html', 'w') as f:
                  f.write(h)
              created += 1

          # Sitemap mit-bauen
          with open('sitemap.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              f.write('  <url><loc>https://hozd.app/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>\n')
              for u in users:
                  uname = u.get('username') or ''
                  if uname:
                      f.write(f'  <url><loc>https://hozd.app/u/{uname}</loc><changefreq>weekly</changefreq><priority>0.7</priority></url>\n')
              f.write('</urlset>\n')

          print(f'✅ Generated {created} profile HTMLs + sitemap.xml')
          PYEOF

      - name: Commit + push if changed
        if: hashFiles('/tmp/hozd_users.json') != ''
        run: |
          git config user.name "hozd-bot"
          git config user.email "bot@hozd.app"
          git add -A u/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "chore(seo): auto-regen profile pages [skip ci]"
            git push
          fi
