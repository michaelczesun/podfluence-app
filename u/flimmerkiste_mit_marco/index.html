<style>
  :root {
    --bg:#0B0B0F; --surface:#15151B; --surface-2:#1F1F2A;
    --text:#FFFFFF; --text-2:rgba(255,255,255,0.7); --text-3:rgba(255,255,255,0.5);
    --primary:#8B5CF6; --primary-2:#C4B5FD;
    --border:rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }

  a:hover { color:var(--text); }
  header { padding: 18px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .brand { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .brand a { color:var(--text); }
  .open-app { background:var(--primary); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; }
  .container { max-width:680px; margin:0 auto; padding:24px 18px 80px; }
  .skeleton { height:90px; background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface)); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px; margin:12px 0; }
  @keyframes sk { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .hero { display:flex; align-items:flex-start; gap:18px; }
  .avatar { width:96px; height:96px; border-radius:48px; background:var(--surface-2); object-fit:cover; flex-shrink:0; }

  .badges { display:inline-flex; align-items:center; gap:6px; margin-left:6px; vertical-align:middle; }

  .badge.verified { background:rgba(59,130,246,0.15); color:#60A5FA; }
  .badge.founder { background:rgba(245,158,11,0.18); color:#FBBF24; }
  .uname { color:var(--text-3); margin:4px 0; font-size:14px; }

  .meta { display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--text-3); margin:10px 0 0; }

  .post-meta { font-size:11px; color:var(--text-3); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
  .post-content { font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .post-img { width:100%; border-radius:10px; margin-top:10px; aspect-ratio: 16 / 9; object-fit:cover; background:var(--surface-2); }
  .post-stats { display:flex; gap:14px; font-size:12px; color:var(--text-3); margin-top:10px; }
  .empty { text-align:center; padding:40px 20px; color:var(--text-3); }
  .error { background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.30); padding:18px; border-radius:14px; color:#FCA5A5; text-align:center; font-size:14px; }
  .cta-box { background:rgba(139,92,246,0.10); border:1px solid rgba(139,92,246,0.35); border-radius:16px; padding:20px; margin:32px 0 0; text-align:center; }
  .cta-box h3 { margin:0 0 8px; font-size:16px; }

<body>
<header>
  <div class="brand"><a href="https://hozd.app">hozd</a></div>

</header>

<div class="container">
  <div id="loading">
    <div class="skeleton"></div>
    <div class="skeleton" style="height:50px;"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
  <div id="content" style="display:none;"></div>
  <div id="error" style="display:none;"></div>
</div>

<footer>
  hozd — die soziale Podcast-App ·
  <a href="https://hozd.app">hozd.app</a> ·
  <a href="https://hozd.app/#impressum">Impressum</a> ·
  <a href="https://hozd.app/#datenschutz">Datenschutz</a>
</footer>

<script>
(function () {
  var SB_URL = 'https://nlgedaxiailhhcmgtmdp.supabase.co';
  var SB_KEY = 'sb_publishable_aJrojJ8QFI0uCETwimeRLw_-ymYCVw_';

  // URL-Parser: ?u=username ODER /u/username/ pfad-style
  function getUsername() {
    var qs = new URLSearchParams(window.location.search);
    var u = qs.get('u') || qs.get('username');
    if (u) return u.replace(/^@/, '').trim();
    // Pfad-style: /u/<username>
    var path = window.location.pathname.replace(/\/+$/, '');
    var segs = path.split('/').filter(Boolean);
    var uIdx = segs.indexOf('u');
    if (uIdx >= 0 && segs[uIdx + 1]) return decodeURIComponent(segs[uIdx + 1]).replace(/^@/, '').trim();
    return null;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      var now = Date.now();
      var diffH = Math.round((now - d.getTime()) / 3600000);
      if (diffH < 1) return 'vor wenigen Minuten';
      if (diffH < 24) return 'vor ' + diffH + ' Stunde' + (diffH === 1 ? '' : 'n');
      var diffD = Math.round(diffH / 24);
      if (diffD < 7) return 'vor ' + diffD + ' Tag' + (diffD === 1 ? '' : 'en');
      return d.toLocaleDateString('de-DE');
    } catch (e) { return iso || ''; }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    var box = document.getElementById('error');
    box.style.display = 'block';
    box.className = 'error';
    box.innerHTML = esc(msg);
  }

  function renderProfile(user, posts) {
    document.getElementById('loading').style.display = 'none';
    var c = document.getElementById('content');
    c.style.display = 'block';

    // Page-Title + OG
    var displayName = user.full_name || user.username;
    document.title = 'hozd · ' + displayName + ' @' + user.username;
    document.getElementById('page-desc').setAttribute('content',
      displayName + (user.bio ? ' — ' + user.bio : '') + ' · hozd Profil');

    var avatar = user.avatar_url && user.avatar_url.trim() !== ''
      ? user.avatar_url
      : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="48" fill="%231F1F2A"/><text x="50%25" y="55%25" text-anchor="middle" font-size="40" font-family="sans-serif" fill="white" font-weight="800">' + esc(displayName.charAt(0).toUpperCase()) + '</text></svg>';

    var typeLabel = user.type === 'podcaster' ? 'Podcaster:in'
                  : user.type === 'listener' ? 'Hörer:in'
                  : user.type === 'bot' ? 'hozd-Bot'
                  : user.type || '';

    var badges = '';
    if (user.is_verified) badges += '<span class="badge verified">✓ verifiziert</span> ';
    // Founder-Badge NUR für michaelczesun (echter Gründer). is_app_admin ist
    // nur Berechtigung, nicht Gründer-Status.
    if (user.username === 'michaelczesun') badges += '<span class="badge founder">👑 Founder</span> ';

    var heroHtml = ''
      + '<div class="hero">'
      + '  <img class="avatar" src="' + esc(avatar) + '" alt="" onerror="this.style.background=\'#1F1F2A\';this.removeAttribute(\'src\');"/>'
      + '  <div class="info">'
      + '    <div class="name">' + esc(displayName) + '<span class="badges">' + badges + '</span></div>'
      + '    <div class="uname">@' + esc(user.username) + (typeLabel ? ' · ' + esc(typeLabel) : '') + '</div>'
      + (user.bio ? '    <div class="bio">' + esc(user.bio) + '</div>' : '')
      + '    <div class="meta">'
      + (user.followers_count != null ? '<span><strong>' + user.followers_count + '</strong> Follower</span>' : '')
      + (user.following_count != null ? '<span><strong>' + user.following_count + '</strong> folgt</span>' : '')
      + (user.country ? '<span>📍 ' + esc(user.country) + '</span>' : '')
      + '    </div>'
      + '  </div>'
      + '</div>';

    var postsHtml;
    if (!posts || posts.length === 0) {
      postsHtml = '<div class="empty">Noch keine Beiträge.</div>';
    } else {
      postsHtml = posts.map(function (p) {
        var raw = String(p.content || '');
        var inlineGif = raw.match(/\[gif\](https?:\/\/\S+)/i);
        var img = (p.image_url && p.image_url.trim() !== '') ? p.image_url
                : (inlineGif ? inlineGif[1] : null);
        var text = raw.replace(/\[gif\]https?:\/\/\S+/gi, '').trim();
        var title = p.title && p.is_longform ? '<strong style="display:block;font-size:16px;margin-bottom:6px;">' + esc(p.title) + '</strong>' : '';
        return ''
          + '<div class="post">'
          + '  <div class="post-meta">' + (p.is_longform ? '📰 Newsletter · ' : '') + fmtDate(p.created_at) + '</div>'
          + '  ' + title
          + (text ? '  <div class="post-content">' + esc(text.slice(0, 600)) + (text.length > 600 ? ' …' : '') + '</div>' : '')
          + (img ? '  <img class="post-img" src="' + esc(img) + '" alt="" loading="lazy"/>' : '')
          + '  <div class="post-stats">'
          + '    <span>♥ ' + (p.likes_count || 0) + '</span>'
          + '    <span>💬 ' + (p.comments_count || 0) + '</span>'
          + '    <span>👁 ' + (p.views_count || 0) + '</span>'
          + '  </div>'
          + '</div>';
      }).join('');
    }

    var ctaHtml = ''
      + '<div class="cta-box">'
      + '  <h3>Möchtest du @' + esc(user.username) + ' folgen?</h3>'
      + '  <p>Lade die hozd-App — kostenlos, ohne Tracking, ohne KI-Training auf deinen Posts.</p>'
      + '  <a class="cta-btn" href="https://hozd.app">App laden →</a>'
      + '</div>';

    c.innerHTML = heroHtml
      + '<div class="section-title">Letzte Beiträge</div>'
      + postsHtml
      + ctaHtml;
  }

  var username = 'flimmerkiste_mit_marco'; // baked at generation time
  if (!username) {
    showError('Kein Profil gewählt. Beispiel: hozd.app/u/michaelczesun');
    return;
  }

  // 4.6.j: RLS blockt anon-Reads auf users → eigene public-profile Edge-Function
  // mit Service-Role intern. Returnt nur whitelisted Public-Felder.
  fetch(SB_URL + '/functions/v1/public-profile?u=' + encodeURIComponent(username), {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
  })
  .then(function (r) {
    if (r.status === 404) {
      showError('Profil @' + esc(username) + ' nicht gefunden.');
      throw new Error('not_found');
    }
    return r.json();
  })
  .then(function (data) {
    if (!data || !data.user) {
      showError('Profil @' + esc(username) + ' nicht gefunden.');
      return;
    }
    renderProfile(data.user, Array.isArray(data.posts) ? data.posts : []);
  })
  .catch(function (e) {
    if (String(e.message) !== 'not_found') {
      showError('Konnte Profil nicht laden: ' + e.message);
    }
  });
})();
</script>
</body>
